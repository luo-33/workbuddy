<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>WorkBuddy · 个人成长</title>
<style>
:root{--bg:#F5F0EB;--card:#fff;--text:#2c2416;--text2:#8c7b6b;--green:#6B8F71;--green2:#A3C4A8;--red:#c4726e;--amber:#d4a853;--blue:#7b9cb8;--border:#e8e0d5;--shadow:0 2px 12px rgba(0,0,0,.06);--r:16px;--r2:12px;--font:'-apple-system','PingFang SC','Microsoft YaHei',sans-serif}
[data-theme="dark"]{--bg:#1a1814;--card:#292520;--text:#e8e0d5;--text2:#9c8f7c;--green:#7eab8a;--green2:#5c7d64;--red:#d48480;--amber:#c99d50;--blue:#8eaac0;--border:#3a352c;--shadow:0 2px 12px rgba(0,0,0,.25)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
header{padding:16px 18px 6px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;background:var(--bg)}
header h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
header .theme-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.page{display:none;padding:0 16px;animation:fadeIn .25s}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-sm{padding:12px 14px;margin-bottom:10px}
.card-title{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card-sub{font-size:12px;color:var(--text2)}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-box{background:var(--card);border-radius:var(--r2);padding:14px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat-box .num{font-size:28px;font-weight:700;color:var(--green);line-height:1.1}
.stat-box .label{font-size:12px;color:var(--text2);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;transition:.15s}
.btn:active{background:var(--bg);transform:scale(.97)}
.btn-primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn-primary:active{background:var(--green2)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;font-family:var(--font);outline:none;transition:.15s}
.input:focus{border-color:var(--green)}
.input-sm{padding:8px 12px;font-size:13px}
select.input{appearance:none;-webkit-appearance:none}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.tag-green{background:var(--green);color:#fff}
.tag-amber{background:var(--amber);color:#fff}
.tag-red{background:var(--red);color:#fff}
.tag-blue{background:var(--blue);color:#fff}
.progress-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin:6px 0}
.progress-fill{height:100%;border-radius:3px;background:var(--green);transition:width .4s}
.list-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.list-item .icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.list-item .info{flex:1;min-width:0}
.list-item .info .title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .info .sub{font-size:12px;color:var(--text2)}
.list-item .right{font-size:12px;color:var(--text2);flex-shrink:0;text-align:right}
.empty{text-align:center;padding:40px 20px;color:var(--text2);font-size:14px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-height:80vh;overflow-y:auto;padding:20px 18px 30px;animation:slideUp .25s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-size:17px;margin-bottom:14px}
.modal .close{position:absolute;top:12px;right:16px;width:32px;height:32px;border-radius:50%;border:none;background:var(--bg);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
nav.bottom-tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--border);z-index:50;padding:4px 0 env(safe-area-inset-bottom,8px)}
nav.bottom-tabs .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:none;background:none;color:var(--text2);font-size:10px;cursor:pointer;transition:.15s}
nav.bottom-tabs .tab.active{color:var(--green)}
nav.bottom-tabs .tab .tab-icon{font-size:20px}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 20px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);font-size:12px;cursor:pointer;background:var(--bg);color:var(--text);transition:.15s;white-space:nowrap}
.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
@media(min-width:500px){body{max-width:480px;margin:0 auto}.bottom-tabs{max-width:480px;left:50%;transform:translateX(-50%)}}
</style>
</head>
<body>

<header>
  <h1>🌿 WorkBuddy</h1>
  <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀️</button>
</header>

<div id="toast" class="toast"></div>

<!-- ===== 首页 ===== -->
<div class="page active" id="page-home">
  <div class="card" style="background:linear-gradient(135deg,#e8f0e8,#f5f0eb)">
    <div class="card-title">⏰ 今日作息</div>
    <div class="stats-row">
      <div class="stat-box" onclick="setTime('wake')">
        <div class="num" id="wakeTime">--:--</div>
        <div class="label">🌅 起床时间</div>
      </div>
      <div class="stat-box" onclick="setTime('sleep')">
        <div class="num" id="sleepTime">--:--</div>
        <div class="label">🌙 睡觉时间</div>
      </div>
    </div>
    <div style="text-align:center;font-size:14px;color:var(--text2)">
      睡眠时长：<strong id="sleepDuration">--</strong>
    </div>
    <div style="text-align:center;margin-top:10px">
      <span id="streakBadge" class="tag tag-green" style="font-size:12px;padding:5px 14px">🔥 连续 1 天</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📋 今日计划 <span class="card-sub" id="planSummary"></span></div>
    <div id="todayPlanList"></div>
    <div class="btn-row" style="margin-top:10px"><button class="btn btn-sm btn-primary" onclick="switchTab('plan')">📝 管理计划</button></div>
  </div>

  <div class="card">
    <div class="card-title">📊 今日概览</div>
    <div class="stats-row">
      <div class="stat-box"><div class="num" id="todayWords">0</div><div class="label">今日单词</div></div>
      <div class="stat-box"><div class="num" id="todayKcal">0</div><div class="label">摄入 kcal</div></div>
    </div>
    <div class="stats-row">
      <div class="stat-box"><div class="num" id="todayExercise">0</div><div class="label">运动 min</div></div>
      <div class="stat-box"><div class="num" id="todayBalance">¥0</div><div class="label">今日收支</div></div>
    </div>
  </div>
</div>

<!-- ===== 英语 ===== -->
<div class="page" id="page-english">
  <div class="card">
    <div class="card-title">📚 IELTS 词汇学习</div>
    <div class="stats-row">
      <div class="stat-box"><div class="num" id="engTotalWords">0</div><div class="label">词库总数</div></div>
      <div class="stat-box"><div class="num" id="engLearned">0</div><div class="label">已掌握</div></div>
    </div>
    <div class="stats-row">
      <div class="stat-box"><div class="num" id="engReviewToday">0</div><div class="label">今日待复习</div></div>
      <div class="stat-box"><div class="num" id="engStreakDays">0</div><div class="label">学习连续天数</div></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="startReview()">🔄 开始复习</button>
      <button class="btn" onclick="openSearchModal()">🔍 搜索单词</button>
      <button class="btn" onclick="openWordbookModal()">📖 我的生词本</button>
    </div>
  </div>

  <div class="card" id="reviewCard" style="display:none">
    <div class="card-title">📝 复习中</div>
    <div style="text-align:center;padding:20px 0">
      <div style="font-size:36px;font-weight:700;margin-bottom:6px" id="reviewWord"></div>
      <div style="font-size:14px;color:var(--text2);margin-bottom:16px" id="reviewPhonetic"></div>
      <button class="btn btn-sm" onclick="speakWord()" style="margin-bottom:12px">🔊 听读音</button>
      <div style="font-size:14px;color:var(--text2);margin-bottom:12px" id="reviewHint"></div>
      <div class="btn-row" style="justify-content:center;margin-bottom:8px">
        <button class="btn btn-sm" onclick="revealMeaning()" id="revealBtn">👁 显示释义</button>
      </div>
      <div style="font-size:16px;margin:8px 0;min-height:24px" id="reviewMeaning"></div>
      <div class="btn-row" style="justify-content:center;margin-top:8px" id="reviewActions" style="display:none">
        <button class="btn btn-sm tag-red" onclick="reviewResult('wrong')">❌ 不认识</button>
        <button class="btn btn-sm tag-amber" onclick="reviewResult('hard')">🤔 犹豫</button>
        <button class="btn btn-sm tag-green" onclick="reviewResult('good')">✅ 认识</button>
      </div>
      <div style="display:none;margin-top:8px" id="spellingSection">
        <input class="input input-sm" placeholder="输入单词拼写..." id="spellingInput" style="text-align:center;margin-top:8px">
        <button class="btn btn-sm" onclick="checkSpelling()" style="margin-top:6px">✅ 提交拼写</button>
        <div id="spellingResult" style="font-size:13px;margin-top:6px"></div>
      </div>
    </div>
    <div style="text-align:center;color:var(--text2);font-size:12px" id="reviewProgress"></div>
  </div>

  <div class="card">
    <div class="card-title">📅 今日学习记录</div>
    <div id="todayEnglishLog"></div>
    <button class="btn btn-sm" onclick="addEnglishLog()" style="margin-top:8px">+ 记录学习</button>
  </div>
</div>

<!-- ===== 健康 ===== -->
<div class="page" id="page-health">
  <div class="card">
    <div class="card-title">🍽️ 今日饮食</div>
    <div class="stats-row">
      <div class="stat-box"><div class="num" id="healthKcal">0</div><div class="label">摄入 kcal</div></div>
      <div class="stat-box"><div class="num" id="healthProtein">0</div><div class="label">蛋白质 g</div></div>
    </div>
    <div class="stats-row">
      <div class="stat-box"><div class="num" id="healthCarbs">0</div><div class="label">碳水 g</div></div>
      <div class="stat-box"><div class="num" id="healthFat">0</div><div class="label">脂肪 g</div></div>
    </div>
    <div id="todayDietList" style="margin-top:8px"></div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-sm btn-primary" onclick="openDietModal()">+ 记录饮食</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">🏃 今日运动</div>
    <div class="stat-box" style="margin-bottom:8px"><div class="num" id="healthExerciseMin">0</div><div class="label">运动分钟</div></div>
    <div id="todayExerciseList"></div>
    <button class="btn btn-sm" onclick="openExerciseModal()" style="margin-top:8px">+ 记录运动</button>
  </div>
</div>

<!-- ===== 财富 ===== -->
<div class="page" id="page-wealth">
  <div class="card">
    <div class="card-title">💰 本月财务</div>
    <div class="stats-row">
      <div class="stat-box" style="border-left:3px solid var(--green)"><div class="num" style="color:var(--green)" id="wealthIncome">¥0</div><div class="label">收入</div></div>
      <div class="stat-box" style="border-left:3px solid var(--red)"><div class="num" style="color:var(--red)" id="wealthExpense">¥0</div><div class="label">支出</div></div>
    </div>
    <div style="text-align:center;font-size:16px;font-weight:600">
      结余：<span id="wealthBalance" style="color:var(--green)">¥0</span>
    </div>
  </div>
  <div class="card">
    <div class="card-title">📋 最近流水</div>
    <div id="wealthList"></div>
    <button class="btn btn-sm btn-primary" onclick="openWealthModal()" style="margin-top:8px">+ 记录收支</button>
  </div>
</div>

<!-- ===== 计划 ===== -->
<div class="page" id="page-plan">
  <div class="card">
    <div class="card-title">📋 今日计划 <span class="card-sub" id="planDate"></span></div>
    <div id="planList"></div>
    <div class="btn-row" style="margin-top:10px">
      <input class="input input-sm" id="newPlanInput" placeholder="添加新任务..." style="flex:1">
      <button class="btn btn-sm btn-primary" onclick="addPlan()">+ 添加</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">📅 历史计划</div>
    <div class="chip-row" id="planDateChips"></div>
    <div id="historyPlanList"></div>
  </div>
</div>

<!-- 底部导航 -->
<nav class="bottom-tabs">
  <button class="tab active" data-tab="home" onclick="switchTab('home')"><span class="tab-icon">🏠</span>首页</button>
  <button class="tab" data-tab="english" onclick="switchTab('english')"><span class="tab-icon">📚</span>英语</button>
  <button class="tab" data-tab="health" onclick="switchTab('health')"><span class="tab-icon">💪</span>健康</button>
  <button class="tab" data-tab="wealth" onclick="switchTab('wealth')"><span class="tab-icon">💰</span>财富</button>
  <button class="tab" data-tab="plan" onclick="switchTab('plan')"><span class="tab-icon">📋</span>计划</button>
</nav>

<!-- Modals will be created dynamically -->
<div class="modal-overlay" id="modalOverlay"></div>

<script>
// ============ DATA LAYER ============
const PREFIX = 'wb_';
const DB = {
  get(key, def) { try { const v = localStorage.getItem(PREFIX+key); return v ? JSON.parse(v) : def; } catch(e) { return def; } },
  set(key, val) { localStorage.setItem(PREFIX+key, JSON.stringify(val)); },
  del(key) { localStorage.removeItem(PREFIX+key); },
  keys() { const ks = []; for(let i=0;i<localStorage.length;i++) { const k=localStorage.key(i); if(k&&k.startsWith(PREFIX)) ks.push(k.slice(PREFIX.length)); } return ks; }
};

function today() { return new Date().toISOString().slice(0,10); }
function nowStr() { return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); }
function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

// ============ THEME ============
function toggleTheme() {
  const r = document.documentElement;
  const isDark = r.getAttribute('data-theme') === 'dark';
  r.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
  DB.set('theme', isDark ? 'light' : 'dark');
}
(function(){ const t=DB.get('theme','light'); document.documentElement.setAttribute('data-theme',t); document.getElementById('themeBtn').textContent=t==='dark'?'🌙':'☀️'; })();

// ============ NAVIGATION ============
let currentTab = 'home';
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.querySelectorAll('.bottom-tabs .tab').forEach(b=>b.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  if(tab==='home') renderHome();
  if(tab==='english') renderEnglish();
  if(tab==='health') renderHealth();
  if(tab==='wealth') renderWealth();
  if(tab==='plan') renderPlan();
}

// ============ TIME INPUT ============
function setTime(type) {
  const t = new Date();
  const h = String(t.getHours()).padStart(2,'0');
  const m = String(t.getMinutes()).padStart(2,'0');
  const val = h+':'+m;
  DB.set('time_'+type+'_'+today(), val);
  toast((type==='wake'?'🌅 起床':'🌙 睡觉')+'时间已记录：'+val);
  renderHome();
}

// ============ STREAK ============
function calcStreak() {
  let s=0; const now=new Date();
  for(let i=0;i<365;i++){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    const hasWake=DB.get('time_wake_'+ds,null);
    const hasSleep=DB.get('time_sleep_'+ds,null);
    const plans=DB.get('plans_'+ds,[]);
    const hasPlan=plans.length>0;
    const engLog=DB.get('english_log_'+ds,[]);
    const hasEng=engLog.length>0;
    if(hasWake||hasSleep||hasPlan||hasEng) s++;
    else break;
  }
  return s;
}

// ============ HOME ============
function renderHome() {
  const td = today();
  const w = DB.get('time_wake_'+td, null);
  const sl = DB.get('time_sleep_'+td, null);
  document.getElementById('wakeTime').textContent = w || '--:--';
  document.getElementById('sleepTime').textContent = sl || '--:--';
  if(w && sl) {
    const [wh,wm]=w.split(':').map(Number), [sh,sm]=sl.split(':').map(Number);
    let wmin=wh*60+wm, smin=sh*60+sm;
    if(smin <= wmin) smin += 24*60;
    const diff = smin - wmin;
    document.getElementById('sleepDuration').textContent = Math.floor(diff/60)+'h '+(diff%60)+'min';
  } else {
    document.getElementById('sleepDuration').textContent = '--';
  }
  const streak = calcStreak();
  document.getElementById('streakBadge').textContent = '🔥 连续 '+streak+' 天';

  // Today plan summary
  const plans = DB.get('plans_'+td, []);
  const done = plans.filter(p=>p.done).length;
  document.getElementById('planSummary').textContent = plans.length ? `(${done}/${plans.length})` : '';
  const planList = document.getElementById('todayPlanList');
  planList.innerHTML = plans.length ? plans.map(p=>`<div style="padding:6px 0;font-size:14px;display:flex;align-items:center;gap:8px"><span style="color:${p.done?'var(--green)':'var(--text2)'}">${p.done?'✅':'⬜'}</span> ${p.text}</div>`).join('') : '<div class="empty">暂无计划</div>';

  // Overview
  const engLog = DB.get('english_log_'+td, []);
  document.getElementById('todayWords').textContent = engLog.reduce((s,l)=>s+(l.wordCount||0),0);
  const dietLog = DB.get('diet_'+td, []);
  document.getElementById('todayKcal').textContent = dietLog.reduce((s,l)=>s+(l.kcal||0),0);
  const exLog = DB.get('exercise_'+td, []);
  document.getElementById('todayExercise').textContent = exLog.reduce((s,l)=>s+(l.min||0),0);
  const wealthLog = DB.get('wealth_'+td, []);
  const bal = wealthLog.reduce((s,l)=>s+(l.type==='income'?l.amount:-l.amount),0);
  document.getElementById('todayBalance').textContent = '¥'+(bal>=0?'+':'')+bal;
}

// ============ IELTS VOCABULARY ============
const IELTS_WORDS = [
  {w:"abandon",m:"放弃；抛弃"}, {w:"abstract",m:"抽象的；摘要"}, {w:"academy",m:"学院；学术"}, {w:"access",m:"进入；通道；访问"},
  {w:"accommodate",m:"容纳；适应"}, {w:"accompany",m:"陪伴；伴随"}, {w:"accomplish",m:"完成；实现"}, {w:"accumulate",m:"积累；积聚"},
  {w:"accurate",m:"精确的"}, {w:"achieve",m:"达到；实现"}, {w:"acknowledge",m:"承认；确认"}, {w:"acquire",m:"获得；习得"},
  {w:"adapt",m:"适应；改编"}, {w:"adequate",m:"充足的"}, {w:"adjust",m:"调整；适应"}, {w:"administration",m:"管理；行政"},

// Initialize word bank
function initWordBank() {
  const existing = DB.get('wordbank', null);
  if(!existing) {
    const bank = IELTS_WORDS.map((e,i) => ({
      id: 'ielts_'+i,
      word: e.w,
      meaning: e.m,
      added: today(),
      learned: false,
      reviews: 0,
      correctCount: 0,
      nextReview: today(),
      interval: 1,
      ease: 2.5
    }));
    DB.set('wordbank', bank);
  }
}
initWordBank();

// ============ ENGLISH ============
function getDueWords() {
  const bank = DB.get('wordbank', []);
  const td = today();
  return bank.filter(w => !w.learned || w.nextReview <= td);
}

function startReview() {
  const due = getDueWords();
  if(due.length === 0) {
    toast('✅ 没有待复习的单词！');
    return;
  }
  const reviewWords = due.sort(() => Math.random() - 0.5).slice(0, 20);
  DB.set('reviewQueue', reviewWords);
  DB.set('reviewIndex', 0);
  DB.set('reviewCorrect', 0);
  document.getElementById('reviewCard').style.display = 'block';
  showReviewWord();
  document.getElementById('page-english').scrollIntoView({behavior:'smooth'});
}

function showReviewWord() {
  const queue = DB.get('reviewQueue', []);
  const idx = DB.get('reviewIndex', 0);
  if(idx >= queue.length) return finishReview();
  const w = queue[idx];
  document.getElementById('reviewWord').textContent = w.word;
  document.getElementById('reviewPhonetic').textContent = '';
  document.getElementById('reviewMeaning').textContent = '';
  document.getElementById('reviewHint').textContent = '';
  document.getElementById('reviewActions').style.display = 'none';
  document.getElementById('revealBtn').style.display = 'inline-block';
  document.getElementById('spellingSection').style.display = 'none';
  document.getElementById('spellingResult').textContent = '';
  document.getElementById('spellingInput').value = '';
  document.getElementById('reviewProgress').textContent = `第 ${idx+1} / ${queue.length} 个`;
}

function speakWord() {
  const queue = DB.get('reviewQueue', []);
  const idx = DB.get('reviewIndex', 0);
  const w = queue[idx];
  if('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(w.word);
    u.lang = 'en-US'; u.rate = 0.85;
    window.speechSynthesis.speak(u);
  } else {
    toast('⚠️ 当前浏览器不支持语音');
  }
}

function revealMeaning() {
  const queue = DB.get('reviewQueue', []);
  const idx = DB.get('reviewIndex', 0);
  const w = queue[idx];
  document.getElementById('reviewMeaning').textContent = w.meaning;
  document.getElementById('reviewActions').style.display = 'flex';
  document.getElementById('revealBtn').style.display = 'none';
  document.getElementById('spellingSection').style.display = 'block';
}

function reviewResult(grade) {
  const queue = DB.get('reviewQueue', []);
  const idx = DB.get('reviewIndex', 0);
  const w = queue[idx];
  // Update spaced repetition data
  const bank = DB.get('wordbank', []);
  const bi = bank.findIndex(b => b.id === w.id);
  if(bi >= 0) {
    const b = bank[bi];
    b.reviews = (b.reviews||0) + 1;
    if(grade === 'good') {
      b.correctCount = (b.correctCount||0) + 1;
      b.interval = Math.round((b.interval||1) * (b.ease||2.5));
      b.ease = Math.min(3, (b.ease||2.5) + 0.1);
      b.learned = true;
    } else if(grade === 'hard') {
      b.interval = Math.max(1, Math.round((b.interval||1) * 0.6));
      b.ease = Math.max(1.3, (b.ease||2.5) - 0.15);
    } else {
      b.interval = 1;
      b.ease = Math.max(1.3, (b.ease||2.5) - 0.2);
    }
    const nd = new Date(); nd.setDate(nd.getDate() + b.interval);
    b.nextReview = nd.toISOString().slice(0,10);
    bank[bi] = b;
  }
  DB.set('wordbank', bank);
  // Log
  const td = today();
  const log = DB.get('english_log_'+td, []);
  log.push({time: nowStr(), word: w.word, meaning: w.meaning, result: grade});
  DB.set('english_log_'+td, log);

  if(grade === 'good') DB.set('reviewCorrect', DB.get('reviewCorrect',0) + 1);
  DB.set('reviewIndex', idx + 1);
  showReviewWord();
}

function checkSpelling() {
  const queue = DB.get('reviewQueue', []);
  const idx = DB.get('reviewIndex', 0);
  const w = queue[idx];
  const input = document.getElementById('spellingInput').value.trim().toLowerCase();
  const correct = w.word.toLowerCase();
  const el = document.getElementById('spellingResult');
  if(input === correct) {
    el.innerHTML = '✅ 拼写正确！';
    el.style.color = 'var(--green)';
  } else {
    el.innerHTML = '❌ 正确拼写：<strong>'+w.word+'</strong>';
    el.style.color = 'var(--red)';
  }
}

function finishReview() {
  const total = DB.get('reviewQueue', []).length;
  const correct = DB.get('reviewCorrect', 0);
  toast(`🎉 复习完成！${correct}/${total} 正确`);
  document.getElementById('reviewCard').style.display = 'none';
  DB.del('reviewQueue');
  DB.del('reviewIndex');
  DB.del('reviewCorrect');
  renderEnglish();
}

function openSearchModal() {
  const q = prompt('🔍 搜索 IELTS 单词（英文）：');
  if(!q) return;
  const bank = DB.get('wordbank', []);
  const found = bank.filter(w => w.word.toLowerCase().includes(q.toLowerCase()));
  if(found.length === 0) {
    // Add to bank
    const word = q.trim().toLowerCase();
    const meaning = prompt(`"${word}" 的中文释义：`);
    if(!meaning) return;
    const exists = bank.find(w => w.word === word);
    if(exists) { toast('⚠️ 该单词已在词库中'); return; }
    bank.push({
      id: 'user_'+Date.now(),
      word, meaning,
      added: today(),
      learned: false,
      reviews: 0, correctCount: 0,
      nextReview: today(),
      interval: 1, ease: 2.5
    });
    DB.set('wordbank', bank);
    toast(`✅ 已添加 "${word}"`);
  } else {
    toast(`🔍 找到 ${found.length} 个匹配单词，已加入词库`);
  }
  renderEnglish();
}

function openWordbookModal() {
  const bank = DB.get('wordbank', []);
  const learned = bank.filter(w=>w.learned);
  const notLearned = bank.filter(w=>!w.learned);
  let html = '<h3>📖 我的生词本</h3>';
  html += '<p style="color:var(--text2);margin-bottom:10px">已掌握 '+learned.length+' | 学习中 '+notLearned.length+' | 总计 '+bank.length+'</p>';
  html += '<div style="max-height:50vh;overflow-y:auto">';
  notLearned.forEach(w => {
    html += `<div class="list-item"><div class="info"><div class="title">${w.word}</div><div class="sub">${w.meaning}</div></div><div class="right">${w.nextReview}</div></div>`;
  });
  html += '</div><button class="btn btn-sm" onclick="closeModal()" style="margin-top:10px">关闭</button>';
  document.getElementById('modalOverlay').innerHTML = '<div class="modal">'+html+'</div>';
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');}
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();});

function addEnglishLog() {
  const cnt = parseInt(prompt('今日学习单词数：')||'0');
  if(!cnt) return;
  const td = today();
  const log = DB.get('english_log_'+td, []);
  log.push({time: nowStr(), wordCount: cnt, note: '自主学习'});
  DB.set('english_log_'+td, log);
  renderEnglish();
}

function renderEnglish() {
  const bank = DB.get('wordbank', []);
  const due = getDueWords();
  document.getElementById('engTotalWords').textContent = bank.length;
  document.getElementById('engLearned').textContent = bank.filter(w=>w.learned).length;
  document.getElementById('engReviewToday').textContent = due.length;
  // Eng streak
  let es=0; const now=new Date();
  for(let i=0;i<365;i++){const d=new Date(now);d.setDate(d.getDate()-i);const ds=d.toISOString().slice(0,10);const log=DB.get('english_log_'+ds,[]);if(log.length>0)es++;else break;}
  document.getElementById('engStreakDays').textContent = es;

  // Today log
  const td = today();
  const log = DB.get('english_log_'+td, []);
  document.getElementById('todayEnglishLog').innerHTML = log.length ? log.map(l=>`<div class="list-item"><div class="info"><div class="title">${l.word||'自主学习'}</div><div class="sub">${l.meaning||l.note||''}</div></div><div class="right"><span class="tag ${l.result==='good'?'tag-green':l.result==='hard'?'tag-amber':l.result==='wrong'?'tag-red':'tag-blue'}">${l.result||l.wordCount+'词'}</span> ${l.time}</div></div>`).join('') : '<div class="empty">暂无学习记录</div>';
}

// ============ HEALTH ============
function openDietModal() {
  const food = prompt('食物名称：'); if(!food) return;
  const kcal = parseInt(prompt('热量（kcal）：')||'0');
  const protein = parseFloat(prompt('蛋白质（g）：')||'0');
  const carbs = parseFloat(prompt('碳水（g）：')||'0');
  const fat = parseFloat(prompt('脂肪（g）：')||'0');
  const td = today();
  const diet = DB.get('diet_'+td, []);
  diet.push({time: nowStr(), food, kcal, protein, carbs, fat});
  DB.set('diet_'+td, diet);
  renderHealth(); toast('✅ 已记录');
}
function openExerciseModal() {
  const type = prompt('运动类型：'); if(!type) return;
  const min = parseInt(prompt('时长（分钟）：')||'0');
  const td = today();
  const ex = DB.get('exercise_'+td, []);
  ex.push({time: nowStr(), type, min});
  DB.set('exercise_'+td, ex);
  renderHealth(); toast('✅ 已记录');
}
function renderHealth() {
  const td = today();
  const diet = DB.get('diet_'+td, []);
  document.getElementById('healthKcal').textContent = diet.reduce((s,l)=>s+(l.kcal||0),0);
  document.getElementById('healthProtein').textContent = diet.reduce((s,l)=>s+Math.round(l.protein||0),0);
  document.getElementById('healthCarbs').textContent = diet.reduce((s,l)=>s+Math.round(l.carbs||0),0);
  document.getElementById('healthFat').textContent = diet.reduce((s,l)=>s+Math.round(l.fat||0),0);
  document.getElementById('todayDietList').innerHTML = diet.map(l=>`<div class="list-item"><div class="info"><div class="title">${l.food}</div><div class="sub">${l.kcal}kcal · 蛋白${l.protein}g · 碳水${l.carbs}g · 脂肪${l.fat}g</div></div><div class="right">${l.time}</div></div>`).join('');
  const ex = DB.get('exercise_'+td, []);
  document.getElementById('healthExerciseMin').textContent = ex.reduce((s,l)=>s+(l.min||0),0);
  document.getElementById('todayExerciseList').innerHTML = ex.map(l=>`<div class="list-item"><div class="info"><div class="title">${l.type}</div><div class="sub">${l.min} 分钟</div></div><div class="right">${l.time}</div></div>`).join('');
}

// ============ WEALTH ============
function openWealthModal() {
  const type = confirm('收入请点确定，支出请点取消') ? 'income' : 'expense';
  const amount = parseFloat(prompt((type==='income'?'收入':'支出')+'金额（¥）：')||'0');
  if(!amount) return;
  const category = prompt('分类（如：工资/餐饮/购物/交通）：')||'其他';
  const note = prompt('备注（可选）：')||'';
  const td = today();
  const wl = DB.get('wealth_'+td, []);
  wl.push({time: nowStr(), type, amount, category, note});
  DB.set('wealth_'+td, wl);
  renderWealth(); toast('✅ 已记录');
}
function renderWealth() {
  const now = new Date();
  const month = now.toISOString().slice(0,7);
  let income = 0, expense = 0;
  const allLogs = [];
  const ks = DB.keys().filter(k=>k.startsWith('wealth_'));
  ks.forEach(k => {
    const logs = DB.get(k, []);
    logs.forEach(l => {
      const d = k.replace('wealth_','');
      const item = {...l, date: d};
      allLogs.push(item);
      if(d.startsWith(month)) {
        if(l.type==='income') income += l.amount;
        else expense += l.amount;
      }
    });
  });
  document.getElementById('wealthIncome').textContent = '¥'+income.toFixed(2);
  document.getElementById('wealthExpense').textContent = '¥'+expense.toFixed(2);
  const bal = income - expense;
  const balEl = document.getElementById('wealthBalance');
  balEl.textContent = '¥'+(bal>=0?'+':'')+bal.toFixed(2);
  balEl.style.color = bal>=0?'var(--green)':'var(--red)';

  allLogs.sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time));
  document.getElementById('wealthList').innerHTML = allLogs.slice(0,15).map(l=>`<div class="list-item"><div class="info"><div class="title">${l.category||'其他'}</div><div class="sub">${l.note||''} · ${l.date}</div></div><div class="right" style="color:${l.type==='income'?'var(--green)':'var(--red)'}">${l.type==='income'?'+':'-'}¥${l.amount.toFixed(2)}</div></div>`).join('') || '<div class="empty">暂无记录</div>';
}

// ============ PLAN ============
function addPlan() {
  const input = document.getElementById('newPlanInput');
  const text = input.value.trim();
  if(!text) return;
  const td = today();
  const plans = DB.get('plans_'+td, []);
  plans.push({text, done: false, time: nowStr()});
  DB.set('plans_'+td, plans);
  input.value = '';
  renderPlan(); toast('✅ 已添加');
}
function togglePlan(index) {
  const td = today();
  const plans = DB.get('plans_'+td, []);
  plans[index].done = !plans[index].done;
  DB.set('plans_'+td, plans);
  renderPlan();
}
function deletePlan(index) {
  const td = today();
  const plans = DB.get('plans_'+td, []);
  plans.splice(index, 1);
  DB.set('plans_'+td, plans);
  renderPlan();
}
function renderPlan() {
  const td = today();
  document.getElementById('planDate').textContent = td;
  const plans = DB.get('plans_'+td, []);
  document.getElementById('planList').innerHTML = plans.length ? plans.map((p,i)=>`<div class="list-item"><div style="cursor:pointer;font-size:18px" onclick="togglePlan(${i})">${p.done?'✅':'⬜'}</div><div class="info"><div class="title" style="${p.done?'text-decoration:line-through;color:var(--text2)':''}">${p.text}</div></div><button class="btn btn-sm" onclick="deletePlan(${i})" style="color:var(--red)">✕</button></div>`).join('') : '<div class="empty">今天还没有计划</div>';

  // History dates
  const dateKeys = DB.keys().filter(k=>k.startsWith('plans_')).map(k=>k.replace('plans_','')).sort().reverse();
  const chips = document.getElementById('planDateChips');
  chips.innerHTML = dateKeys.slice(0,7).map(d=>`<span class="chip ${d===td?'active':''}" onclick="loadHistoryPlan('${d}',this)">${d}</span>`).join('');
  if(dateKeys.length > 0) loadHistoryPlan(dateKeys[0]);
}
function loadHistoryPlan(date, el) {
  document.querySelectorAll('#planDateChips .chip').forEach(c=>c.classList.remove('active'));
  if(el) el.classList.add('active');
  const plans = DB.get('plans_'+date, []);
  document.getElementById('historyPlanList').innerHTML = plans.length ? plans.map(p=>`<div class="list-item"><span>${p.done?'✅':'⬜'}</span><div class="info"><div class="title">${p.text}</div></div><div class="right">${p.time}</div></div>`).join('') : '<div class="empty">该日无计划</div>';
}
